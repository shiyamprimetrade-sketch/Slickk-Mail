# LOCAL WINDOWS DEVELOPMENT ONLY. All exposed sockets are bound to loopback.
# Real Internet SMTP delivery is NOT provided by this configuration.
name: slickk-mail-local
services:
  stalwart:
    image: stalwartlabs/stalwart:v1.0
    container_name: slickk-mail-local-stalwart
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # bootstrap admin; loopback only
      - "127.0.0.1:8443:443"  # HTTPS/JMAP; requires local trusted certificate for full browser use
      - "127.0.0.1:2525:25"  # local SMTP test; NEVER public
      - "127.0.0.1:1465:465" # local TLS submission
      - "127.0.0.1:1993:993" # local IMAPS
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    security_opt:
      - no-new-privileges:true

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:1.19.1
    container_name: slickk-mail-local-webmail
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # local setup wizard; not public
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      APP_NAME: "SLICKK Mail"
      # Do not set JMAP_SERVER_URL: the first-run wizard must appear.
    volumes:
      - bulwark-data:/app/data
    depends_on:
      - stalwart
    security_opt:
      - no-new-privileges:true
volumes:
  stalwart-etc:
  stalwart-data:
  bulwark-data:
